name: Daily refresh
# Runs the same complete pipeline as refresh.sh on the Mac: download the lists, read the employer boards
# (weekly), read postings, judge them, check the result and publish. A test run with a limit never
# touches the published data: crawl.py writes limited runs to a separate ".partial" file.
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC every day
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, quick or full"
        required: false
        default: "auto"
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh and publish
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ -n "$REED_API_KEY" ]; then printf '%s' "$REED_API_KEY" > "$RUNNER_TEMP/reed_key.txt"; export REED_KEY_FILE="$RUNNER_TEMP/reed_key.txt"; fi
          bash refresh.sh "${MODE:-auto}"
