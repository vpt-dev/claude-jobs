name: Daily job crawl
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC every day
  workflow_dispatch:
    inputs:
      limit:
        description: "Only crawl the first N boards (blank for all)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl employer job boards
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ -n "$LIMIT" ]; then python3 crawl.py seeds.json data/ats_jobs.json --limit "$LIMIT"; else python3 crawl.py seeds.json data/ats_jobs.json; fi
      - name: Fetch UK roles from Reed
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: |
          if [ -n "$REED_API_KEY" ]; then python3 reed.py data/reed_jobs.json; else echo "No Reed key set; skipping"; fi
      - name: Commit results
        run: |
          git config user.name "job-crawler"
          git config user.email "job-crawler@users.noreply.github.com"
          git add data/ats_jobs.json data/reed_jobs.json 2>/dev/null || git add data/ats_jobs.json
          git diff --cached --quiet || git commit -m "Daily crawl $(date -u +%F)"
          git push
