name: Daily job crawl
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl employer job boards
        run: python3 crawl.py seeds.json data/ats_jobs.json
      - name: Commit results
        run: |
          git config user.name "job-crawler"
          git config user.email "job-crawler@users.noreply.github.com"
          git add data/ats_jobs.json
          git diff --cached --quiet || git commit -m "Daily crawl $(date -u +%F)"
          git push
